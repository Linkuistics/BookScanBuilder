[project]
name = "bookscan-builder"
version = "0.1.0"
description = "Explicit PDF book preparation"
requires-python = ">=3.12,<3.13"
dependencies = ["pikepdf==10.16.0"]

[project.scripts]
bookscan = "bookscan.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookscan"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.0", "pyright==1.1.407"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
