version: '3'

vars:
  COLLECTION: /Volumes/Glass/Book Conversion
  DESIGN_PORT: '8769'
  MODE: all
  GEOMETRY_BINARY: /private/tmp/bookscan-page-geometry

tasks:
  prepare:copy-experiment:
    desc: Check whole-page copying on bounded real and labelled PDF fixtures
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --no-project --python 3.12 --with 'pikepdf==10.16.0' python experiments/prepared_pdf_copy.py --collection '{{.COLLECTION}}' --output-dir '{{.ARTIFACTS}}'

  prepare:design-render:
    desc: Render the editable preparation design views (D2 0.9.0)
    cmds:
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/prepared-pdf/assembly.d2 docs/design/prepared-pdf/assembly.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/prepared-pdf/publication.d2 docs/design/prepared-pdf/publication.svg

  prepare:design-serve:
    desc: Serve only the preparation design directory on localhost
    cmds:
      - python3 -m http.server '{{.DESIGN_PORT}}' --bind 127.0.0.1 --directory docs/design/prepared-pdf

  prepare:setup:
    desc: Sync locked Python/pikepdf environment and check acceptance renderer
    cmds:
      - uv sync --locked
      - command -v pdftoppm
      - command -v pdftotext

  prepare:run:
    desc: Assemble explicitly selected whole PDF pages
    cmds:
      - uv run --locked bookscan prepare {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  prepare:check:
    desc: Check preparation without Poppler or the source collection
    cmds:
      - uv run --locked ruff format --check src tests
      - uv run --locked ruff check src tests
      - uv run --locked pyright
      - uv run --locked pytest -q

  prepare:acceptance:
    desc: Matched 300-dpi synthetic/real copying acceptance (MODE=synthetic|real|all)
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/prepare_acceptance.py --mode '{{.MODE}}' --artifacts '{{.ARTIFACTS}}' {{if ne .MODE "synthetic"}}--collection '{{.COLLECTION}}'{{end}}

  geometry:setup:
    desc: Check the bounded experiment's renderer/compiler/native library
    cmds:
      - command -v pdftoppm
      - command -v clang
      - pkg-config --modversion lept
      - uv run --script experiments/page_geometry.py --help

  geometry:build:
    desc: Build disposable Leptonica wrapper outside the product package
    cmds:
      - clang -Wall -Wextra -Werror -O2 experiments/page_geometry.c $(pkg-config --cflags --libs lept) -o '{{.GEOMETRY_BINARY}}'

  geometry:render:
    desc: Render the two explicitly identified complete source pages at 300 dpi
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --script experiments/page_geometry.py render --collection '{{.COLLECTION}}' --artifacts '{{.ARTIFACTS}}'

  geometry:mark:
    desc: Freeze independent manual coordinates and holdout masks; inspect marked PNGs before compare
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --script experiments/page_geometry.py mark --artifacts '{{.ARTIFACTS}}'

  geometry:compare:
    desc: Evaluate frozen guides and sampler; human visual judgment remains explicit
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --script experiments/page_geometry.py compare --collection '{{.COLLECTION}}' --artifacts '{{.ARTIFACTS}}' --binary '{{.GEOMETRY_BINARY}}'

  geometry:staff-check:
    desc: Check native coordinate gate boundaries without source PDFs or correction outputs
    cmds:
      - uv run --locked ruff format --check experiments/staff_coordinates.py experiments/test_staff_coordinates.py
      - uv run --locked ruff check experiments/staff_coordinates.py experiments/test_staff_coordinates.py
      - uv run --no-project --python 3.12 --with 'pytest==8.4.2' --with 'pillow==11.3.0' --with 'numpy==2.2.6' pytest -q experiments/test_staff_coordinates.py

  geometry:staff-preflight:
    desc: Recheck frozen staff acquisition diagnostics and exact native prerequisites; never fit
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --script experiments/staff_coordinates.py --artifacts '{{.ARTIFACTS}}'

  geometry:staff-views:
    desc: Reproduce observed page-20 source displays and pinned prerequisites outside the collection
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --script experiments/staff_coordinates.py --source-views --artifacts '{{.ARTIFACTS}}'
