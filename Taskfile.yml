version: '3'

vars:
  COLLECTION: /Volumes/Glass/Book Conversion
  DESIGN_PORT: '8769'
  MODE: all
  GEOMETRY_BINARY: /private/tmp/bookscan-page-geometry

tasks:
  prepare:copy-experiment:
    desc: Check whole-page copying on bounded real and labelled PDF fixtures
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --no-project --python 3.12 --with 'pikepdf==10.16.0' python experiments/prepared_pdf_copy.py --collection '{{.COLLECTION}}' --output-dir '{{.ARTIFACTS}}'

  prepare:design-render:
    desc: Render the editable preparation design views (D2 0.9.0)
    cmds:
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/prepared-pdf/assembly.d2 docs/design/prepared-pdf/assembly.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/prepared-pdf/publication.d2 docs/design/prepared-pdf/publication.svg

  prepare:design-serve:
    desc: Serve only the preparation design directory on localhost
    cmds:
      - python3 -m http.server '{{.DESIGN_PORT}}' --bind 127.0.0.1 --directory docs/design/prepared-pdf

  prepare:setup:
    desc: Sync locked Python/pikepdf environment and check acceptance renderer
    cmds:
      - uv sync --locked
      - command -v pdftoppm
      - command -v pdftotext

  prepare:run:
    desc: Assemble explicitly selected whole PDF pages
    cmds:
      - uv run --locked bookscan prepare {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  prepare:check:
    desc: Check preparation without Poppler or the source collection
    cmds:
      - uv run --locked ruff format --check src tests
      - uv run --locked ruff check src tests
      - uv run --locked pyright
      - uv run --locked pytest -q

  prepare:acceptance:
    desc: Matched 300-dpi synthetic/real copying acceptance (MODE=synthetic|real|all)
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/prepare_acceptance.py --mode '{{.MODE}}' --artifacts '{{.ARTIFACTS}}' {{if ne .MODE "synthetic"}}--collection '{{.COLLECTION}}'{{end}}

  geometry:setup:
    desc: Check the bounded experiment's renderer/compiler/native library
    cmds:
      - command -v pdftoppm
      - command -v clang
      - pkg-config --modversion lept
      - uv run --script experiments/page_geometry.py --help

  geometry:build:
    desc: Build disposable Leptonica wrapper outside the product package
    cmds:
      - clang -Wall -Wextra -Werror -O2 experiments/page_geometry.c $(pkg-config --cflags --libs lept) -o '{{.GEOMETRY_BINARY}}'

  geometry:render:
    desc: Render the two explicitly identified complete source pages at 300 dpi
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --script experiments/page_geometry.py render --collection '{{.COLLECTION}}' --artifacts '{{.ARTIFACTS}}'

  geometry:mark:
    desc: Freeze independent manual coordinates and holdout masks; inspect marked PNGs before compare
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --script experiments/page_geometry.py mark --artifacts '{{.ARTIFACTS}}'

  geometry:compare:
    desc: Evaluate frozen guides and sampler; human visual judgment remains explicit
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --script experiments/page_geometry.py compare --collection '{{.COLLECTION}}' --artifacts '{{.ARTIFACTS}}' --binary '{{.GEOMETRY_BINARY}}'

  geometry:staff-check:
    desc: Check native coordinate gate boundaries without source PDFs or correction outputs
    cmds:
      - uv run --locked ruff format --check experiments/staff_coordinates.py experiments/test_staff_coordinates.py
      - uv run --locked ruff check experiments/staff_coordinates.py experiments/test_staff_coordinates.py
      - uv run --no-project --python 3.12 --with 'pytest==8.4.2' --with 'pillow==11.3.0' --with 'numpy==2.2.6' pytest -q experiments/test_staff_coordinates.py

  geometry:staff-preflight:
    desc: Recheck frozen staff acquisition diagnostics and exact native prerequisites; never fit
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --script experiments/staff_coordinates.py --artifacts '{{.ARTIFACTS}}'

  geometry:staff-views:
    desc: Reproduce observed page-20 source displays and pinned prerequisites outside the collection
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --script experiments/staff_coordinates.py --source-views --artifacts '{{.ARTIFACTS}}'

  geometry:norwegian-preflight:
    desc: Freeze complete half canvases and unmasked native extraction diagnostics; never fit
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --script experiments/norwegian_preflight.py --collection '{{.COLLECTION}}' --artifacts '{{.ARTIFACTS}}'

  geometry:norwegian-addressing:
    desc: Generate fixed-format blind pixel-address controls outside the collection; no baseline claim
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --script experiments/norwegian_addressing.py --artifacts '{{.ARTIFACTS}}'

  process:design-render:
    desc: Render the agreed editable page/book geometry design (D2 0.9.0)
    cmds:
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/rotation-processor/workflow.d2 docs/design/rotation-processor/workflow.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/rotation-processor/review.d2 docs/design/rotation-processor/review.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/rotation-processor/versions.d2 docs/design/rotation-processor/versions.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/rotation-processor/book-alignment.d2 docs/design/rotation-processor/book-alignment.svg
      - cp docs/specs/prepared-pdf.md docs/design/rotation-processor/prepared-pdf-reference.md
      - cp docs/adr/prepared-page-hints.md docs/design/rotation-processor/prepared-page-hints-reference.md
      - cp docs/adr/geometry-review-handoff.md docs/design/rotation-processor/geometry-review-handoff-reference.md
      - cp docs/adr/finite-baseline-commands.md docs/design/rotation-processor/finite-baseline-commands-reference.md
      - >-
        uv run --no-project --python 3.12 --with 'markdown==3.9' python -c
        'from pathlib import Path; import markdown;
        source = Path("docs/specs/rotation-processor.md").read_text();
        body = markdown.markdown(source, extensions=["tables", "toc"]);
        body = body.replace("href=\"../adr/prepared-page-hints.md\"", "href=\"prepared-page-hints-reference.md\"").replace("href=\"../adr/geometry-review-handoff.md\"", "href=\"geometry-review-handoff-reference.md\"").replace("href=\"../adr/finite-baseline-commands.md\"", "href=\"finite-baseline-commands-reference.md\"").replace("href=\"../design/rotation-processor/README.md\"", "href=\"index.html#discussion\"");
        page = "<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content=width=device-width><title>Page and book geometry — agreed baseline and Design v2</title><style>body{font:17px/1.6 system-ui;margin:2rem auto;max-width:85ch;padding:0 1rem;color:#172d40;background:#fff}h1,h2,h3{scroll-margin-top:2rem}table{display:block;overflow-x:auto;border-collapse:collapse;width:100%}td,th{border:1px solid #ccd5dd;padding:.5rem;text-align:left}a{color:#075ea5}code{overflow-wrap:anywhere}pre{overflow:auto}@media(prefers-color-scheme:dark){body{color:#ddd;background:#182028}a{color:#9acfff}td,th{border-color:#526272}}</style><a href=index.html#discussion>Editable visual discussion</a><main>" + body + "</main></html>";
        Path("docs/design/rotation-processor/contract.html").write_text(page)'

  process:design-serve:
    desc: Serve only the page/book geometry design on localhost
    cmds:
      - python3 -m http.server '{{.DESIGN_PORT}}' --bind 127.0.0.1 --directory docs/design/rotation-processor

  process:baseline-design-render:
    desc: Render the agreed finite baseline discussion from the canonical spec (D2 0.9.0)
    cmds:
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/rotation-processor/baseline-flow.d2 docs/design/rotation-processor/baseline-flow.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/rotation-processor/baseline-checkpoints.d2 docs/design/rotation-processor/baseline-checkpoints.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/rotation-processor/baseline-delivery.d2 docs/design/rotation-processor/baseline-delivery.svg
      - task: process:design-render
      - >-
        python3 -c
        'from pathlib import Path;
        source = Path("docs/design/rotation-processor/contract.html").read_text();
        panel = "<section id=current-decision><h2>Finite baseline interface agreed</h2><p>The human replied yes to the concrete command, lifecycle, compatibility and test seams, with a finite-owner-only session exception. Browser completion remains required. No product or image result is accepted.</p><p><a href=\"#finite-baseline-review\">Read the agreed baseline contract</a> · <a href=\"#finite-baseline-interface-and-test-seams\">Actual reply and scope</a></p></section>";
        page = source.replace("<main>", "<main>" + panel, 1);
        Path("docs/design/rotation-processor/baseline-delivery.html").write_text(page)'
