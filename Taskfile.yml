version: '3'

vars:
  COLLECTION: /Volumes/Glass/Book Conversion
  DESIGN_PORT: '8769'
  MODE: all
  GEOMETRY_BINARY: /private/tmp/bookscan-page-geometry

tasks:
  prepare:copy-experiment:
    desc: Check whole-page copying on bounded real and labelled PDF fixtures
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --no-project --python 3.12 --with 'pikepdf==10.16.0' python experiments/prepared_pdf_copy.py --collection '{{.COLLECTION}}' --output-dir '{{.ARTIFACTS}}'

  prepare:design-render:
    desc: Render the editable preparation design views (D2 0.9.0)
    cmds:
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/prepared-pdf/assembly.d2 docs/design/prepared-pdf/assembly.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/prepared-pdf/publication.d2 docs/design/prepared-pdf/publication.svg

  prepare:design-serve:
    desc: Serve only the preparation design directory on localhost
    cmds:
      - python3 -m http.server '{{.DESIGN_PORT}}' --bind 127.0.0.1 --directory docs/design/prepared-pdf

  prepare:setup:
    desc: Sync locked Python/pikepdf environment and check acceptance renderer
    cmds:
      - uv sync --locked
      - command -v pdftoppm
      - command -v pdftotext

  prepare:run:
    desc: Assemble explicitly selected whole PDF pages
    cmds:
      - uv run --locked bookscan prepare {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  prepare:check:
    desc: Check preparation without Poppler or the source collection
    cmds:
      - uv run --locked ruff format --check src tests
      - uv run --locked ruff check src tests
      - uv run --locked pyright
      - uv run --locked pytest -q

  prepare:acceptance:
    desc: Matched 300-dpi synthetic/real copying acceptance (MODE=synthetic|real|all)
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/prepare_acceptance.py --mode '{{.MODE}}' --artifacts '{{.ARTIFACTS}}' {{if ne .MODE "synthetic"}}--collection '{{.COLLECTION}}'{{end}}

  geometry:setup:
    desc: Check the bounded experiment's renderer/compiler/native library
    cmds:
      - command -v pdftoppm
      - command -v clang
      - pkg-config --modversion lept
      - uv run --script experiments/page_geometry.py --help

  geometry:build:
    desc: Build disposable Leptonica wrapper outside the product package
    cmds:
      - clang -Wall -Wextra -Werror -O2 experiments/page_geometry.c $(pkg-config --cflags --libs lept) -o '{{.GEOMETRY_BINARY}}'

  geometry:render:
    desc: Render the two explicitly identified complete source pages at 300 dpi
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --script experiments/page_geometry.py render --collection '{{.COLLECTION}}' --artifacts '{{.ARTIFACTS}}'

  geometry:mark:
    desc: Freeze independent manual coordinates and holdout masks; inspect marked PNGs before compare
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --script experiments/page_geometry.py mark --artifacts '{{.ARTIFACTS}}'

  geometry:compare:
    desc: Evaluate frozen guides and sampler; human visual judgment remains explicit
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --script experiments/page_geometry.py compare --collection '{{.COLLECTION}}' --artifacts '{{.ARTIFACTS}}' --binary '{{.GEOMETRY_BINARY}}'

  geometry:staff-check:
    desc: Check native coordinate gate boundaries without source PDFs or correction outputs
    cmds:
      - uv run --locked ruff format --check experiments/staff_coordinates.py experiments/test_staff_coordinates.py
      - uv run --locked ruff check experiments/staff_coordinates.py experiments/test_staff_coordinates.py
      - uv run --no-project --python 3.12 --with 'pytest==8.4.2' --with 'pillow==11.3.0' --with 'numpy==2.2.6' pytest -q experiments/test_staff_coordinates.py

  geometry:staff-preflight:
    desc: Recheck frozen staff acquisition diagnostics and exact native prerequisites; never fit
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --script experiments/staff_coordinates.py --artifacts '{{.ARTIFACTS}}'

  geometry:staff-views:
    desc: Reproduce observed page-20 source displays and pinned prerequisites outside the collection
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --script experiments/staff_coordinates.py --source-views --artifacts '{{.ARTIFACTS}}'

  geometry:norwegian-preflight:
    desc: Freeze complete half canvases and unmasked native extraction diagnostics; never fit
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --script experiments/norwegian_preflight.py --collection '{{.COLLECTION}}' --artifacts '{{.ARTIFACTS}}'

  geometry:norwegian-addressing:
    desc: Generate fixed-format blind pixel-address controls outside the collection; no baseline claim
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --script experiments/norwegian_addressing.py --artifacts '{{.ARTIFACTS}}'

  process:design-render:
    desc: Render the agreed editable page/book geometry design (D2 0.9.0)
    cmds:
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/rotation-processor/workflow.d2 docs/design/rotation-processor/workflow.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/rotation-processor/review.d2 docs/design/rotation-processor/review.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/rotation-processor/versions.d2 docs/design/rotation-processor/versions.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/rotation-processor/book-alignment.d2 docs/design/rotation-processor/book-alignment.svg
      - cp docs/specs/prepared-pdf.md docs/design/rotation-processor/prepared-pdf-reference.md
      - cp docs/adr/prepared-page-hints.md docs/design/rotation-processor/prepared-page-hints-reference.md
      - cp docs/adr/geometry-review-handoff.md docs/design/rotation-processor/geometry-review-handoff-reference.md
      - cp docs/adr/finite-baseline-commands.md docs/design/rotation-processor/finite-baseline-commands-reference.md
      - >-
        uv run --no-project --python 3.12 --with 'markdown==3.9' python -c
        'from pathlib import Path; import markdown;
        source = Path("docs/specs/rotation-processor.md").read_text();
        body = markdown.markdown(source, extensions=["tables", "toc"]);
        body = body.replace("href=\"../adr/prepared-page-hints.md\"", "href=\"prepared-page-hints-reference.md\"").replace("href=\"../adr/geometry-review-handoff.md\"", "href=\"geometry-review-handoff-reference.md\"").replace("href=\"../adr/finite-baseline-commands.md\"", "href=\"finite-baseline-commands-reference.md\"").replace("href=\"../design/rotation-processor/README.md\"", "href=\"index.html#discussion\"");
        page = "<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content=width=device-width><title>Page and book geometry — agreed baseline and Design v2</title><style>body{font:17px/1.6 system-ui;margin:2rem auto;max-width:85ch;padding:0 1rem;color:#172d40;background:#fff}h1,h2,h3{scroll-margin-top:2rem}table{display:block;overflow-x:auto;border-collapse:collapse;width:100%}td,th{border:1px solid #ccd5dd;padding:.5rem;text-align:left}a{color:#075ea5}code{overflow-wrap:anywhere}pre{overflow:auto}@media(prefers-color-scheme:dark){body{color:#ddd;background:#182028}a{color:#9acfff}td,th{border-color:#526272}}</style><a href=index.html#discussion>Editable visual discussion</a><main>" + body + "</main></html>";
        Path("docs/design/rotation-processor/contract.html").write_text(page)'

  process:design-serve:
    desc: Serve only the page/book geometry design on localhost
    cmds:
      - python3 -m http.server '{{.DESIGN_PORT}}' --bind 127.0.0.1 --directory docs/design/rotation-processor

  process:baseline-design-render:
    desc: Render the agreed finite baseline discussion from the canonical spec (D2 0.9.0)
    cmds:
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/rotation-processor/baseline-flow.d2 docs/design/rotation-processor/baseline-flow.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/rotation-processor/baseline-checkpoints.d2 docs/design/rotation-processor/baseline-checkpoints.svg
      - d2 --layout=dagre --theme=0 --dark-theme=200 docs/design/rotation-processor/baseline-delivery.d2 docs/design/rotation-processor/baseline-delivery.svg
      - task: process:design-render
      - >-
        python3 -c
        'from pathlib import Path;
        source = Path("docs/design/rotation-processor/contract.html").read_text();
        panel = "<section id=current-decision><h2>Finite interface and Q1–Q3 public repairs agreed</h2><p>The human replied yes to the original interface/test seams and finite-owner-only session exception, then separately replied Approve Q1–Q3 as written (Recommended) to the exact public repair proposal. Reason domains, result/help grammar and distinct issuance are integrated. Browser completion remains required. No product or image result is accepted.</p><p><a href=\"#integrated-public-protocol-repairs\">Integrated Q1–Q3 rules</a> · <a href=\"#finite-baseline-review\">Baseline contract</a> · <a href=\"#finite-baseline-interface-and-test-seams\">Replies and their scopes</a></p></section>";
        page = source.replace("<main>", "<main>" + panel, 1);
        Path("docs/design/rotation-processor/baseline-delivery.html").write_text(page)'

  process:native-ruler:
    desc: Construct an unused renderer-independent PNG; BACKING_SCALE must be measured
    requires:
      vars: [ARTIFACTS, BACKING_SCALE]
    cmds:
      - uv run --locked python tests/native_view_scale.py generate --output '{{.ARTIFACTS}}/ruler.png' --backing-scale '{{.BACKING_SCALE}}'

  process:native-measure:
    desc: Measure original viewer capture bytes; independent window dimensions are required
    requires:
      vars: [CAPTURE, LEFT, TOP, RIGHT, BOTTOM, FRAMEBUFFER_WIDTH, FRAMEBUFFER_HEIGHT]
    cmds:
      - uv run --locked python tests/native_view_scale.py measure '{{.CAPTURE}}' --region '{{.LEFT}}' '{{.TOP}}' '{{.RIGHT}}' '{{.BOTTOM}}' --framebuffer-size '{{.FRAMEBUFFER_WIDTH}}' '{{.FRAMEBUFFER_HEIGHT}}'

  process:setup:
    desc: Sync locked Python dependencies and explicitly build/check the packaged advisory helper
    cmds:
      - uv sync --locked
      - uv run --locked python -m bookscan.native_setup {{if .NATIVE_CACHE}}--cache {{.NATIVE_CACHE | shellQuote}}{{end}}

  process:preflight:
    desc: Verify supported native versions/cache and controls without building or importing a PDF
    cmds:
      - uv run --locked python -m bookscan.native_setup --check {{if .NATIVE_CACHE}}--cache {{.NATIVE_CACHE | shellQuote}}{{end}}

  process:check:
    desc: Check current product Python code and unit contracts without native tools or collection reads
    cmds:
      - task: prepare:check

  process:asset-acceptance:
    desc: Check actual RGB asset writer publication/signals/death/reopen; no checkpoint or public-create claim
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/asset_acceptance.py --artifacts {{.ARTIFACTS | shellQuote}} {{if .PYTHON}}--python {{.PYTHON | shellQuote}}{{end}}

  process:checkpoint-acceptance:
    desc: Check actual installed checkpoint writer barriers/signals/death/reopen; no public-create claim
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/checkpoint_acceptance.py --artifacts {{.ARTIFACTS | shellQuote}} {{if .PYTHON}}--python {{.PYTHON | shellQuote}}{{end}}

  process:header-acceptance:
    desc: Verify saved native header identities and complete checkpoint history on actual writer restart
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/checkpoint_acceptance.py --header --artifacts {{.ARTIFACTS | shellQuote}} {{if .PYTHON}}--python {{.PYTHON | shellQuote}}{{end}}

  process:source-acceptance:
    desc: Verify saved sole-PDF meaning and source-loss restart at actual checkpoint writer barriers
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/checkpoint_acceptance.py --source --artifacts {{.ARTIFACTS | shellQuote}} {{if .PYTHON}}--python {{.PYTHON | shellQuote}}{{end}}

  process:analysis-record-check:
    desc: Verify saved advisory meaning, dependency-free reads and checkpoint history; no complete-project claim
    cmds:
      - uv run --locked pytest -q tests/test_analysis_record.py tests/test_assessment.py

  process:occurrence-core-check:
    desc: Bind all saved occurrence identities, geometry, RGB and analysis; native/review semantics remain separate
    cmds:
      - uv run --locked pytest -q tests/test_occurrence_record.py tests/test_source_record.py tests/test_analysis_record.py tests/test_asset_records.py

  process:triage-record-check:
    desc: Verify initial saved reason details/domains and predecessor semantics; no complete-project claim
    cmds:
      - uv run --locked pytest -q tests/test_triage_record.py tests/test_assessment.py tests/test_analysis_record.py

  process:render-record-check:
    desc: Verify saved MediaBox render policy and predecessor records without launching native tools
    cmds:
      - uv run --locked pytest -q tests/test_render_record.py tests/test_render.py

  process:named-resource-record-check:
    desc: Verify saved named inventory consistency and source-loss history; runtime-use truth remains separate
    cmds:
      - uv run --locked pytest -q tests/test_resource_record.py tests/test_resources.py tests/test_resource_directories.py

  process:fontconfig-record-check:
    desc: Verify saved configuration-only guards and source-loss history without native launches
    cmds:
      - uv run --locked pytest -q tests/test_fontconfig_record.py tests/test_resource_record.py tests/test_fontconfig.py

  process:fontconfig-cache-record-check:
    desc: Verify saved cache construction against completed named subjects without historical native I/O
    cmds:
      - uv run --locked pytest -q tests/test_fontconfig_cache_record.py tests/test_fontconfig_record.py tests/test_fontconfig_cache.py

  process:linked-record-check:
    desc: Verify saved static native graph closure and named digests without historical file or native reads
    cmds:
      - uv run --locked pytest -q tests/test_linked_record.py tests/test_dependencies.py tests/test_resource_record.py

  process:fontconfig-discovery-record-check:
    desc: Bind saved discovery/copy scope, native graph and completed cache without historical I/O
    cmds:
      - uv run --locked pytest -q tests/test_fontconfig_discovery_record.py tests/test_fontconfig_record.py tests/test_fontconfig_cache_record.py tests/test_linked_record.py

  process:native-sample-record-check:
    desc: Verify retained native channels, resolved profile/palette references and saved history without conversion
    cmds:
      - uv run --locked pytest -q tests/test_native_sample_record.py tests/test_samples.py tests/test_profiles.py tests/test_assessment.py

  process:native-sample-record-acceptance:
    desc: Restore actual constructed native channels/profile/palette bytes after PDF loss; no composition claim
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/native_sample_record_acceptance.py --artifacts {{.ARTIFACTS | shellQuote}}

  process:native-acceptance:
    desc: Build the actual packaged helper and check native signs/sentinels/cache/RGB retention
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/native_skew_acceptance.py --artifacts '{{.ARTIFACTS}}'

  process:native-cancel-acceptance:
    desc: Exercise private owner cancellation with actual native preflight children; no project/writer claim
    requires:
      vars: [NATIVE_CACHE, REPORT]
    cmds:
      - uv run --locked python tests/native_cancel_acceptance.py --cache {{.NATIVE_CACHE | shellQuote}} --output {{.REPORT | shellQuote}}

  process:import-acceptance:
    desc: Check exact private sole-PDF snapshot and independent physical mapping; no renderer/project claim
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/static_import_acceptance.py --artifacts {{.ARTIFACTS | shellQuote}}

  process:render-acceptance:
    desc: Check complete MediaBox Cairo RGB against independent aligned pixel truth; no project/public claim
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/render_acceptance.py --artifacts {{.ARTIFACTS | shellQuote}}

  process:dependency-preflight:
    desc: Read-only helper/Cairo/static codec identities; runtime resources remain unverified
    cmds:
      - uv run --locked python -m bookscan.dependencies {{if .NATIVE_CACHE}}--cache {{.NATIVE_CACHE | shellQuote}}{{end}}

  process:dependency-acceptance:
    desc: Check actual static native identities and owner callback/reaping; no project/writer claim
    requires:
      vars: [NATIVE_CACHE, REPORT]
    cmds:
      - uv run --locked python tests/dependency_acceptance.py --cache {{.NATIVE_CACHE | shellQuote}} --output {{.REPORT | shellQuote}}

  process:placement-acceptance:
    desc: Check analytic image placements/ppi and actual Cairo annotation visibility; no composition-fidelity claim
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/placement_acceptance.py --artifacts {{.ARTIFACTS | shellQuote}}

  process:sample-acceptance:
    desc: Check independent packed source channels/metadata; no RGB conversion/composition-fidelity claim
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/sample_acceptance.py --artifacts {{.ARTIFACTS | shellQuote}}

  process:codec-acceptance:
    desc: Check independent DCT/CCITT native channels and polarity; no complete-page fidelity claim
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/codec_acceptance.py --artifacts {{.ARTIFACTS | shellQuote}}

  process:colour-acceptance:
    desc: Check independent native Decode/palette/colour-key display; no complete-page colour-fidelity claim
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/colour_acceptance.py --artifacts {{.ARTIFACTS | shellQuote}}

  process:composition-acceptance:
    desc: Check independent grey/inline/stencil/mask/half-pixel compositions with actual Cairo; fonts/ICC/real truth remain unverified
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/composition_acceptance.py --artifacts {{.ARTIFACTS | shellQuote}}

  process:assessment-acceptance:
    desc: Check every-occurrence snapshot/render/native analysis records and unchanged RGB; no saved project/public claim
    requires:
      vars: [ARTIFACTS, NATIVE_CACHE]
    cmds:
      - uv run --locked python tests/assessment_acceptance.py --artifacts {{.ARTIFACTS | shellQuote}} --cache {{.NATIVE_CACHE | shellQuote}}

  process:advanced-composition-acceptance:
    desc: Check independent embedded text/Matte/Screen/600-ppi constructions; ICC/runtime/real truth remain unverified
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/advanced_composition_acceptance.py --artifacts {{.ARTIFACTS | shellQuote}}

  process:runtime-fixtures:
    desc: Declare/build test-owned Mac dlopen and analytic RGB fixtures into an unused directory
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/runtime_acceptance.py build --artifacts {{.ARTIFACTS | shellQuote}}

  process:runtime-acceptance:
    desc: Observe actual PID-bound renderer/Python/dlopen UUID events; complete runtime resources remain unverified
    requires:
      vars: [FIXTURES, ARTIFACTS]
    cmds:
      - uv run --locked python tests/runtime_acceptance.py check --fixtures {{.FIXTURES | shellQuote}} --artifacts {{.ARTIFACTS | shellQuote}}

  process:profile-acceptance:
    desc: Check constructed ICC power/matrix/Decode/palette/native RGB and actual Cairo; no real calibration claim
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/profile_acceptance.py --artifacts {{.ARTIFACTS | shellQuote}}

  process:matrix-acceptance:
    desc: Read exact constructed ICC matrices/powers and native deviations; conversion precision remains unavailable
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/matrix_acceptance.py --artifacts {{.ARTIFACTS | shellQuote}}

  process:target-fixtures:
    desc: Build test-owned Mac arm64 ICC target observer and ordinary source into an unused directory
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/target_acceptance.py build --artifacts {{.ARTIFACTS | shellQuote}}

  process:target-acceptance:
    desc: Observe actual Cairo target handles and serialized matrices; CMM precision/fidelity remain unverified
    requires:
      vars: [FIXTURES, ARTIFACTS]
    cmds:
      - uv run --locked python tests/target_acceptance.py check --fixtures {{.FIXTURES | shellQuote}} --artifacts {{.ARTIFACTS | shellQuote}}

  process:memory-fixtures:
    desc: Build test-owned Mac arm64 profile-memory observer and fixed source into an unused directory
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/memory_acceptance.py build --artifacts {{.ARTIFACTS | shellQuote}}

  process:memory-acceptance:
    desc: Bind actual ICC profile-memory values and tables; CMM pipeline/precision/fidelity remain unverified
    requires:
      vars: [FIXTURES, ARTIFACTS]
    cmds:
      - uv run --locked python tests/memory_acceptance.py check --fixtures {{.FIXTURES | shellQuote}} --artifacts {{.ARTIFACTS | shellQuote}}

  process:formatter-fixtures:
    desc: Build test-owned Mac arm64 actual-transform formatter observer into an unused directory
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/formatter_acceptance.py build --artifacts {{.ARTIFACTS | shellQuote}}

  process:formatter-acceptance:
    desc: Verify actual RGB formatter codes; intermediate CMM pipeline and fidelity remain unverified
    requires:
      vars: [FIXTURES, ARTIFACTS]
    cmds:
      - uv run --locked python tests/formatter_acceptance.py check --fixtures {{.FIXTURES | shellQuote}} --artifacts {{.ARTIFACTS | shellQuote}}

  process:pipeline-fixtures:
    desc: Build a test-only exact-ABI final-transform observer and wrong-offset control into an unused directory
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/pipeline_acceptance.py build --artifacts {{.ARTIFACTS | shellQuote}}

  process:pipeline-acceptance:
    desc: Bind actual final stages to profile-memory algebra and transform probes; complete CMM precision remains unverified
    requires:
      vars: [FIXTURES, ARTIFACTS]
    cmds:
      - uv run --locked python tests/pipeline_acceptance.py check --fixtures {{.FIXTURES | shellQuote}} --artifacts {{.ARTIFACTS | shellQuote}}

  process:gamma-fixtures:
    desc: Build a test-owned actual-source-curve evaluator observer into an unused directory
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/gamma_acceptance.py build --artifacts {{.ARTIFACTS | shellQuote}}

  process:gamma-acceptance:
    desc: Check all source gamma-2 word inputs against exact rounding truth; complete CMM precision remains unverified
    requires:
      vars: [FIXTURES, ARTIFACTS]
    cmds:
      - uv run --locked python tests/gamma_acceptance.py check --fixtures {{.FIXTURES | shellQuote}} --artifacts {{.ARTIFACTS | shellQuote}}

  process:stage-fixtures:
    desc: Build a test-owned actual-stage evaluator observer and wrong-offset child into an unused directory
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/stage_acceptance.py build --artifacts {{.ARTIFACTS | shellQuote}}

  process:stage-acceptance:
    desc: Bind actual source/matrix stage pointers and finite rational arithmetic; complete CMM precision remains unverified
    requires:
      vars: [FIXTURES, ARTIFACTS]
    cmds:
      - uv run --locked python tests/stage_acceptance.py check --fixtures {{.FIXTURES | shellQuote}} --artifacts {{.ARTIFACTS | shellQuote}}

  process:traversal-fixtures:
    desc: Build a test-owned full-LUT observer and actual wrong-ABI/bypassed-stage controls
    requires:
      vars: [ARTIFACTS]
    cmds:
      - uv run --locked python tests/traversal_acceptance.py build --artifacts {{.ARTIFACTS | shellQuote}}

  process:traversal-acceptance:
    desc: Observe ordered full-LUT transform probes; reversed-target/saturation/full ICC fidelity remain unverified
    requires:
      vars: [FIXTURES, ARTIFACTS]
    cmds:
      - uv run --locked python tests/traversal_acceptance.py check --fixtures {{.FIXTURES | shellQuote}} --artifacts {{.ARTIFACTS | shellQuote}}

  process:saturation-acceptance:
    desc: Check bound native float-to-word arithmetic on fresh traversal probes twice; target/full ICC fidelity remain unverified
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    requires:
      vars: [FIXTURES, ARTIFACTS]
    cmds:
      - uv run --locked python tests/saturation_acceptance.py --fixtures {{.FIXTURES | shellQuote}} --artifacts {{.ARTIFACTS | shellQuote}}

  process:reversed-acceptance:
    desc: Check fixed reversed-sRGB finite accuracy on fresh native probes twice; complete ICC fidelity remains unverified
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    requires:
      vars: [FIXTURES, ARTIFACTS]
    cmds:
      - uv run --locked python tests/reversed_acceptance.py --fixtures {{.FIXTURES | shellQuote}} --artifacts {{.ARTIFACTS | shellQuote}}

  process:composed-acceptance:
    desc: Check conditional source-to-byte envelopes on fresh native probes twice; arbitrary ICC/page fidelity remain unverified
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    requires:
      vars: [FIXTURES, ARTIFACTS]
    cmds:
      - uv run --locked python tests/composed_acceptance.py --fixtures {{.FIXTURES | shellQuote}} --artifacts {{.ARTIFACTS | shellQuote}}

  process:pixel-fixtures:
    desc: Build test-only repeated-source and actual CMM-call observers from unchanged traversal fixtures
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    requires:
      vars: [FIXTURES, ARTIFACTS]
    cmds:
      - uv run --locked python tests/pixel_acceptance.py build --fixtures {{.FIXTURES | shellQuote}} --artifacts {{.ARTIFACTS | shellQuote}}

  process:pixel-acceptance:
